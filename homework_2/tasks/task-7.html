<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css" />
    <link rel="stylesheet" href="/JS_2026/css/reset.css" />
    <link rel="stylesheet" href="/JS_2026/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Задача 7</title>
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <div class="content__container flex-body">
                <article class="nb-card no-hover">
                    <div class="nb-card-content">
                        <h4 class="nb-card-title">Задача 7</h4>
                        <p class="nb-card-text text-card">Знайти суму випадкового номера місяця (від 1 до 12) та
                            випадкового номера дня (від 0 до 6).
                        </p>
                    </div>
                </article>
                <script>
                    const randomMonthNumber = Math.floor(Math.random() * 12 + 1)
                    const randomDayNumber = Math.floor(Math.random() * 7)

                    const sumNumber = randomMonthNumber + randomDayNumber

                    document.write(`
                        <div class="no-hover nb-w-full task">
                            <p>Випадковий номер місяця(1-12):${randomMonthNumber}</p>
                            <p>Випадковий номер дня(0-6):${randomDayNumber}</p>
                            <p>Сума :${sumNumber}</p>
                        </div>
                    `)
                </script>
            </div>
        </main>
    </div>
</body>

</html>
