<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css" />
    <link rel="stylesheet" href="/JS_2026/css/reset.css" />
    <link rel="stylesheet" href="/JS_2026/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Задача 2</title>
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <div class="content__container flex-body">
                <article class="nb-card no-hover">
                    <div class="nb-card-content">
                        <h4 class="nb-card-title">Задача 2</h4>
                        <p class="nb-card-text text-card">Дано рік народження(дата 1 січня) та поточний рік. Знайти
                            кількість років.
                        </p>
                    </div>
                </article>
                <script>
                    const birthYear = parseInt(prompt("Введіть свій рік народження", 0))
                    const currentDate = new Date()
                    const currentYear = currentDate.getFullYear()

                    const age = currentYear - birthYear

                    document.write(`
                        <div class="no-hover nb-w-full task">
                            <p>Ваш рік народження: ${birthYear}</p>
                            <p>Зараз: ${currentYear} рік</p>
                             <p>Ваш вік: ${age} років</p>
                        </div>
                    `)
                </script>
            </div>
        </main>
    </div>
</body>

</html>
