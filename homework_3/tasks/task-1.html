<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css" />
    <link rel="stylesheet" href="/JS_2026/css/reset.css" />
    <link rel="stylesheet" href="/JS_2026/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Задача 1</title>
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <div class="content__container flex-body">
                <article class="nb-card no-hover">
                    <div class="nb-card-content">
                        <h4 class="nb-card-title">Задача 1</h4>
                        <p class="nb-card-text text-card">З клавіатури вводяться імена двох дітей та кількість у них
                            цукерок. Вивести на екран ім’я тієї дитини, у якої кількість цукерок є більшою, або вивести,
                            що кількість однакова.</p>
                    </div>

                </article>
                <script>
                    const firstChild = prompt("Введіть ім'я першої дитини", "Петро")
                    const firstChildCandy = parseInt(prompt(`${firstChild} має стільки цукерок:`, 1))
                    const secondChild = prompt("Введіть ім'я другої дитини", "Павло")
                    const secondChildCandy = parseInt(prompt(`${secondChild} має стільки цукерок:`, 2))

                    if (firstChildCandy > secondChildCandy) {
                        document.write(`
                            <div class="no-hover nb-w-full task">
                                <p> ${firstChild} має більше цукерок</p>
                            </div>
                        `)
                    } else if (firstChildCandy < secondChildCandy) {
                        document.write(`
                            <div class="no-hover nb-w-full task">
                                <p> ${secondChild} має більше цукерок</p>
                            </div>
                        `)
                    } else {
                        document.write(`
                            <div class="no-hover nb-w-full task">
                                <p> ${firstChild} та  ${secondChild} мають порівну цукерок</p>
                            </div>
                        `)
                    }
                </script>
            </div>
    </div>
    </main>
    </div>
</body>

</html>
