<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css" />
    <link rel="stylesheet" href="/JS_2026/css/reset.css" />
    <link rel="stylesheet" href="/JS_2026/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Задача 5</title>
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <div class="content__container flex-body">
                <article class="nb-card no-hover">
                    <div class="nb-card-content">
                        <h4 class="nb-card-title">Задача 5</h4>
                        <p class="nb-card-text text-card">З клавіатури вводиться назва категорії водія (А-мотоцикл,
                            В-легковий автомобіль, С-вантажний автомобіль). Вивести на екран назву транспортного засобу,
                            яким він може керувати.
                        </p>

                    </div>
                </article>
                <script>
                    const driverCategory = prompt("Введіть категорію водія, великими латинськими літерами", "A")
                    let driverTransport

                    switch (driverCategory) {
                        case "A":
                            driverTransport = "мотоциклом"
                            break;

                        case "B":
                            driverTransport = "легковим автомобілем"
                            break;

                        case "C":
                            driverTransport = "вантажним автомобілем"
                            break;
                        default:
                            alert("Схоже ви ввели щось не так")
                            break;
                    }

                    document.write(`
                        <div class="no-hover nb-w-full task">
                            <p>Введена категорія: ${driverCategory}</p>
                            <p>Водій може керувати ${driverTransport}</p>
                        </div>
                    `)
                </script>
            </div>
        </main>
    </div>
</body>

</html>
