<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css" />
    <link rel="stylesheet" href="/JS_2026/css/reset.css" />
    <link rel="stylesheet" href="/JS_2026/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Задача 6</title>
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <div class="content__container flex-body">
                <article class="nb-card no-hover">
                    <div class="nb-card-content">
                        <h4 class="nb-card-title">Задача 6</h4>
                        <p class="nb-card-text text-card">З клавіатури вводиться номер дня тижня. Вивести на екран назву
                            дня.</p>
                    </div>
                </article>
                <script>
                    const dayNumber = parseInt(prompt("Введіть номер дня, від 1 до 7:"))
                    let day;

                    switch (dayNumber) {

                        case 1:
                            day = "Понеділок"
                            break;

                        case 2:
                            day = "Вівторок"
                            break;

                        case 3:
                            day = "Середа"
                            break;

                        case 4:
                            day = "Четвер"
                            break;

                        case 5:
                            day = "П'ятниця"
                            break;

                        case 6:
                            day = "Субота"
                            break;

                        case 7:
                            day = "Неділя"
                            break;

                        default:
                            alert("Немає такого дня")
                            break;
                    }

                    document.write(`
                        <div class="no-hover nb-w-full task">
                             <p>Номер дня: ${dayNumber}</p>
                            <p>Це ${day}</p>
                        </div>
                    `)
                </script>
            </div>
        </main>
    </div>
</body>

</html>
