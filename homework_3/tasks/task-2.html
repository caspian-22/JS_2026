<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matifandy8/NeoBrutalismCSS/dist/index.min.css" />
    <link rel="stylesheet" href="/JS_2026/css/reset.css" />
    <link rel="stylesheet" href="/JS_2026/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>Задача 2</title>
</head>

<body>
    <div class="wrapper">
        <main class="content">
            <div class="content__container flex-body">
                <article class="nb-card no-hover">
                    <div class="nb-card-content">
                        <h4 class="nb-card-title">Задача 2</h4>
                        <p class="nb-card-text text-card">З клавіатури вводиться ціна товару і кількість грошей. Якщо
                            грошей не вистачає то відмовляємо у покупці, інакше, якщо ще залишаються гроші, то
                            пропонуємо купити лотерею за 4 грн.
                        </p>

                    </div>
                </article>
                <script>
                    const productPrice = parseFloat(prompt("Введіть ціну товару", 100))
                    const moneyAmount = parseFloat(prompt("Введіть кількість грошей", 500))
                    const lotteryTicketPrice = 4
                    const showLottery = (moneyAmount - productPrice) >= lotteryTicketPrice

                    if (moneyAmount < productPrice) alert("У вас недостатньо коштів!")
                    else if ((moneyAmount > productPrice) && showLottery) alert("Не бажаєте купити лоторею за 4 грн ?")
                    else alert("Дякуємо за покупку!")
                </script>
            </div>
        </main>
    </div>
</body>

</html>
